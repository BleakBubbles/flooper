<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flooper</title>
    <meta name="description" content="A tiny, chill feedback widget for indie websites." />
    <meta name="theme-color" content="#000000" />

    <!-- Icons. All generated by design/logo/generate.mjs (`pnpm logo`).
         SVG for browsers that support it; the .ico for those that don't. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Slack, Discord, iMessage, X...). Some crawlers need
         og:image to be an absolute URL; set it to the real domain at deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flooper" />
    <meta property="og:description" content="A tiny, chill feedback widget for indie websites." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
